server:
  port: 8086
  tomcat:
    # M7-A 调优：基线 400 并发冲刺 94 个 accept 拒连（默认 accept-count=100）——加大 backlog 吸收突发建连。
    # threads.max 实验后维持默认 200：调到 400 时缓存命中路径 +74%（8146 QPS）但拒绝路径调度风暴 -64%（3722→1329），
    # CPU 饱和场景线程翻倍是负优化，两场景权衡后保 200（详见任务卡 m7-load-test.md 调优对照表）
    accept-count: 1000


spring:
  application:
    name: localink-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/localink?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: localink123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      # M7-A 调优：对齐 seckill-order 3 分区（默认 1 线程消费，峰值排水慢；分区少的 topic 多余线程闲置无害）
      concurrency: 3

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true

localink:
  seckill:
    notice:
      lead-minutes: 2
      expired-tolerance-minutes: 5
    consume:
      max-stale-ms: 10000
      max-attempts: 4
      backoff-initial-ms: 200
      backoff-multiplier: 2
      backoff-max-ms: 1000
  mq:
    topics:
      seckill-order:
        partitions: 3
        replicas: 1
      cache-invalidation:
        partitions: 1
        replicas: 1
      post-search-sync:
        partitions: 3
        replicas: 1
      post-audit:
        partitions: 3
        replicas: 1
  cache:
    bloom:
      filters:
        shop:
          key-template: shop:bloom:id
          expected-insertions: 100000
          false-probability: 0.01
    local:
      caches:
        shop:
          maximum-size: 1000
          expire-after-write: 10s
  ratelimit:
    scenes:
      sms-send:
        algorithm: SLIDING_WINDOW
        threshold: 1
        window: 60s
      seckill-token:
        algorithm: SLIDING_WINDOW
        threshold: 10
        window: 60s
        overrides:
          USER:
            threshold: 3
  sharding:
    sql-show: false
    # M7-A 调优：基线 400 并发申请令牌时 Hikari 爆池（total=10, waiting=122, 3s 超时→500）
    primary-pool:
      maximum-pool-size: 30
      connection-timeout: 3000
    datasources:
      ds_1:
        url: jdbc:mysql://localhost:3306/localink_1?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: root
        password: localink123
        maximum-pool-size: 30
  reconcile:
    enabled: true
    interval-ms: 300000
    grace-minutes: 2
    failure-age-alarm-hours: 24
  delay:
    key-prefix: "lk:"
    shards: 2
  order:
    close-delay: 15m
  feed:
    big-v-fans-threshold: 1000
    inbox-max-size: 1024
  search:
    uris:
      - http://localhost:9200
  hot:
    enabled: true
    interval-ms: 300000
    recency-days: 7
    half-life-hours: 72
    weights:
      like: 5
      comment: 3
      view: 1
  storage:
    type: local
    dir: ./upload
    url-prefix: "/upload"
