server:
  port: 8086

spring:
  application:
    name: localink-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/localink?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: localink123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true

localink:
  seckill:
    consume:
      max-stale-ms: 10000
      max-attempts: 4
      backoff-initial-ms: 200
      backoff-multiplier: 2
      backoff-max-ms: 1000
  mq:
    topics:
      seckill-order:
        partitions: 3
        replicas: 1
      cache-invalidation:
        partitions: 1
        replicas: 1
  cache:
    bloom:
      filters:
        shop:
          key-template: shop:bloom:id
          expected-insertions: 100000
          false-probability: 0.01
    local:
      caches:
        shop:
          maximum-size: 1000
          expire-after-write: 10s
  ratelimit:
    scenes:
      sms-send:
        algorithm: SLIDING_WINDOW
        threshold: 1
        window: 60s
      seckill-token:
        algorithm: SLIDING_WINDOW
        threshold: 10
        window: 60s
        overrides:
          USER:
            threshold: 3
  sharding:
    sql-show: false
    datasources:
      ds_1:
        url: jdbc:mysql://localhost:3306/localink_1?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: root
        password: localink123
  reconcile:
    enabled: true
    interval-ms: 300000
    grace-minutes: 2
    failure-age-alarm-hours: 24
  delay:
    key-prefix: "lk:"
    shards: 2
  order:
    close-delay: 15m
