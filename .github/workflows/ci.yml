name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端（单测 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: localink-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: localink-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend-compile:
    name: 后端（编译级：主代码 + 测试代码）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 集成测试需 MySQL/Redis/Kafka/ES 真实中间件（AGENTS.md §10 串行独占口径），
      # CI 只做编译级门禁：package -DskipTests 会编译主代码与测试代码但不运行；
      # mvnw 在 Windows 仓库里不带可执行位，先补 chmod
      - run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B -q
