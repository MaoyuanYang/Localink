spring:
  data:
    redis:
      host: localhost
      port: 6379

localink:
  ratelimit:
    static-whitelist:
      - 10.10.10.10
    scenes:
      test-window:
        algorithm: SLIDING_WINDOW
        threshold: 2
        window: 60s
      test-bucket:
        algorithm: TOKEN_BUCKET
        capacity: 2
        rate-per-sec: 0.0001
      test-user:
        algorithm: SLIDING_WINDOW
        threshold: 100
        window: 60s
        overrides:
          USER:
            threshold: 1
